<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Vishal Kaushal | Flutter | Android Developer">

  <!-- iOS meta tags & icons -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>vishal's portfolio</title>
  <link rel="manifest" href="manifest.json">
  <style>
    .boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0A0C10;
      z-index: 0;
    }
    .boot-wrap {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .boot-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(45, 212, 191, 0.14);
      border-top-color: #2DD4BF;
      animation: boot-spin 0.9s linear infinite;
    }
    .boot-mark {
      font-family: Inter, system-ui, sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #2DD4BF;
    }
    @media (max-width: 700px) and (orientation: portrait) {
      .boot-wrap {
        width: 196px;
        height: 196px;
      }
      .boot-mark {
        font-size: 32px;
      }
      .boot-ring {
        border-width: 4px;
      }
    }
    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body style="background-color:#0A0C10;margin:0;">
  <div class="boot">
    <div class="boot-wrap">
      <div class="boot-ring"></div>
      <div class="boot-mark">VK</div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
