<!DOCTYPE html>
<html>
<head>
  <!--
    Deploy to GitHub Pages with:
    flutter build web --release --base-href="/my_portfolio/"
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Vishal Kaushal | Flutter | Android Developer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>vishal's portfolio</title>
  <link rel="manifest" href="manifest.json">
  <style>
    .boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0A0C10;
      z-index: 9999;
    }
    .boot-wrap {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .boot-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(45, 212, 191, 0.14);
      border-top-color: #2DD4BF;
      animation: boot-spin 0.9s linear infinite;
    }
    .boot-mark {
      font-family: Inter, system-ui, sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #2DD4BF;
    }
    @media (max-width: 700px) and (orientation: portrait) {
      .boot-wrap {
        width: 196px;
        height: 196px;
      }
      .boot-mark {
        font-size: 32px;
      }
      .boot-ring {
        border-width: 4px;
      }
    }
    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body style="background-color:#0A0C10;margin:0;">
  <div class="boot">
    <div class="boot-wrap">
      <div class="boot-ring"></div>
      <div class="boot-mark">VK</div>
    </div>
  </div>
  <script>
    (async function () {
      if (location.protocol === 'file:') {
        document.querySelector('.boot').innerHTML =
          '<p style="color:#9AA3B2;font-family:Inter,system-ui,sans-serif;text-align:center;max-width:28rem;line-height:1.55;padding:24px;margin:0">' +
          'Flutter web cannot run from a local file.<br><br>' +
          'From the project folder run:<br>' +
          '<code style="color:#2DD4BF">python3 -m http.server 8080 --directory build/web</code><br><br>' +
          'then open <code style="color:#2DD4BF">http://localhost:8080</code>' +
          '</p>';
        return;
      }

      function resolveBaseHref() {
        if (location.hostname.endsWith('github.io')) {
          var first = location.pathname.split('/').filter(Boolean)[0];
          if (first) return '/' + first + '/';
        }
        var built = document.querySelector('base');
        var builtHref = (built && built.getAttribute('href')) || '/';
        // GitHub Pages builds use /my_portfolio/, but a local server of
        // build/web is at /. Ignore the baked-in path in that case.
        if (builtHref !== '/' && location.pathname.indexOf(builtHref) !== 0) {
          return '/';
        }
        return builtHref;
      }

      var baseHref = resolveBaseHref();
      var baseEl = document.querySelector('base');
      if (!baseEl) {
        baseEl = document.createElement('base');
        document.head.insertBefore(baseEl, document.head.firstChild);
      }
      baseEl.href = baseHref;
      window.__FLUTTER_ASSET_BASE = baseHref;

      // Old Flutter deploys registered a service worker that can intercept
      // flutter_bootstrap.js and leave the site stuck on this loader.
      if ('serviceWorker' in navigator) {
        var registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map(function (registration) {
          return registration.unregister();
        }));
      }
      if (window.caches) {
        var keys = await caches.keys();
        await Promise.all(keys.map(function (key) {
          return caches.delete(key);
        }));
      }

      var script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      script.onerror = function () {
        var mark = document.querySelector('.boot-mark');
        if (mark) mark.textContent = '!';
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
